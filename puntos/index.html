async function voidVisit(record){

  if(reason.length<3||reason.length>200)return showError('Escribe un motivo de 3 a 200 caracteres.');
  setBusy(true);setError('');
  try{
    const voidId='void-'+record.id;
    if(isDemo){
      if(demoVoids.some(v=>v.visitId===record.id))throw Error('La atención ya fue anulada.');
      if((demoClientState.points||0)<record.points||demoClientState.visits<1)throw Error('No se puede anular: saldo o visitas insuficientes.');
      setDemoVoids(rows=>[...rows,{id:voidId,visitId:record.id,userId:'demo',points:record.points,reason,staffId:'demo-jefa',createdAt:{toDate:()=>new Date()}}]);
      setDemoClientState(c=>({...c,points:c.points-record.points,visits:c.visits-1}));
    }else{
      if(!db||!canVoid)throw Error('La conexión con Firebase no está disponible para anular atenciones.');
      const visitRef=db.collection('visits').doc(record.id);
      const voidRef=db.collection('voids').doc(voidId);
      const userRef=db.collection('users').doc(record.userId);
      await db.runTransaction(async t=>{
        const original=await t.get(visitRef);
        const previous=await t.get(voidRef);
        const client=await t.get(userRef);
        if(!original.exists||!client.exists)throw Error('No se encontró la atención o la clienta.');
        if(previous.exists)throw Error('Esta atención ya fue anulada.');
        const visit=original.data(),balance=client.data();

        if((balance.points||0)<visit.points||(balance.visits||0)<1)throw Error('La clienta ya usó esos puntos o no tiene visitas suficientes. No se puede anular automáticamente.');

async function resolveReward(request,approve){
setBusy(true);setError('');
try{
  const prize=REWARDS.find(z=>z.id===request.rewardId);
  if(!prize)throw Error('Recompensa no encontrada.');
  if(isDemo){
    const existing=demoRequestsState.find(r=>r.id===request.id&&r.status==='pending');
    if(!existing)throw Error('El canje ya fue procesado.');
    if(approve&&demoClientState.points<prize.points)throw Error('Puntos insuficientes.');
    if(approve)setDemoClientState(c=>({...c,points:c.points-prize.points}));
    setDemoRequestsState(rows=>rows.map(r=>r.id===request.id?{...r,status:approve?'approved':'rejected'}:r));
    showNotice(approve?'Canje simulado aprobado.':'Canje simulado rechazado.');
    return;
  }
  if(!db||!isAdmin)throw new Error('Solo la jefa de salón puede procesar canjes.');
  const redemptionRef=db.collection('redemptions').doc(request.id);
  const userRef=db.collection('users').doc(request.userId);
  await db.runTransaction(async t=>{
    const redemption=await t.get(redemptionRef);
    const client=await t.get(userRef);
    if(!redemption.exists||redemption.data().status!=='pending')throw Error('Canje ya procesado.');
    if(!client.exists)throw Error('Clienta no encontrada.');
    const confirmed=REWARDS.find(r=>r.id===redemption.data().rewardId);
    if(!confirmed)throw Error('Recompensa desconocida.');
    if(approve){
      if((client.data().points||0)<confirmed.points)throw Error('La clienta no tiene suficientes puntos.');
      t.update(userRef,{points:client.data().points-confirmed.points,lastEventId:redemptionRef.id,lastEventType:'redemption',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
    t.update(redemptionRef,{status:approve?'approved':'rejected',processedBy:user.uid,processedAt:firebase.firestore.FieldValue.serverTimestamp()});
  });
  showNotice(approve?'Canje aprobado: puntos descontados.':'Solicitud rechazada.');
}catch(x){showError(x)}finally{setBusy(false)}
}
