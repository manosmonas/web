.pointsCard{background:linear-gradient(145deg,#fff 55%,#fff6ec);border-color:#efd9cb}.pointsRow{align-items:center}.monasCoin{display:inline-grid;place-items:center;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 30% 22%,#fff6b7 0%,#f4cb61 33%,#dc9e30 78%,#c18424 100%);border:2px solid #e6b94f;box-shadow:inset 0 0 0 2px #fff0a7,0 3px 7px #c18d2940;color:#925b1b;font-family:Georgia,serif;font-weight:bold;text-shadow:0 1px #fff6c4}.coinBalance{width:48px;height:48px;font-size:25px;transform:rotate(-8deg);animation:coin-breathe 3.4s ease-in-out infinite}.goalHeader{display:flex;align-items:center;gap:12px;margin:21px 0 12px}.goalThumb{width:56px;height:56px;border-radius:13px;overflow:hidden;border:1px solid #edd2c4;flex:0 0 56px}.goalThumb img{width:100%;height:100%;object-fit:cover}.goalCopy{flex:1;min-width:0;display:grid;gap:3px}.goalCopy .eyebrow{font-size:10px;color:#a87a38;letter-spacing:.1em}.goalCopy strong{font-size:16px;color:#593a4d;line-height:1.2}.goalCopy span{font-size:12px;color:#a0808c}.goalPercent{font-size:25px;font-weight:850;letter-spacing:-.05em;color:#ad7532;flex-shrink:0}.goalMeter{position:relative;padding:5px 0 14px}.goalTrack{position:relative;height:21px;border-radius:99px;background:#f5e5df;box-shadow:inset 0 2px 4px #8f553219,0 0 11px #e6b45839;overflow:hidden;border:1px solid #ecd5bd;animation:goal-glow 2.8s ease-in-out infinite}.goalTrack:after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:99px;background:linear-gradient(105deg,transparent 35%,#ffffff65 50%,transparent 65%);background-size:250% 100%;animation:goal-track-sheen 3.8s linear infinite}.goalFill{position:relative;height:100%;border-radius:99px;background:linear-gradient(100deg,#c98a36 0%,#f3bf58 40%,#ffe9a2 75%,#e8ad41 100%);box-shadow:inset 0 2px 3px #fff4b7,0 0 12px #eab1438c;transition:width .16s linear;overflow:hidden}.goalSheen{position:absolute;inset:0;background:linear-gradient(110deg,transparent 26%,#fffbe2 47%,#ffffffa0 5 .photoFrame{position:relative;width:100%;height:100%;overflow:hidden;background:#f6e3ea}.photoPlaceholder{position:absolute;inset:0;display:grid;place-items:center;color:#bd8b9d;font-size:22px;background:linear-gradient(110deg,#f5e1e9 25%,#fff5f9 45%,#f5e1e9 65%);background-size:230% 100%;animation:photo-shimmer 1.8s linear infinite}.photoFrame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.025);transition:opacity .48s ease,transform .6s ease}.photo-ready .photoPlaceholder{opacity:0;animation:none}.photo-ready img{opacity:1;transform:scale(1)}.photo-error .photoPlaceholder{animation:none;opacity:.4}.photoFallback{position:absolute;inset:0;display:grid;place-items:center;font-size:24px}.goalThumb .photoPlaceholder{font-size:14px}.goalThumb .photoFallback{font-size:18px}.rewardArt .photoFrame{position:absolute;inset:0}

async function voidVisit(record){
  if(!record||!isAdmin)return showError('Solo la jefa puede anular una atención.');
  const reason=voidReason.trim();
  if(reason.length<3||reason.length>200)return showError('Escribe un motivo de 3 a 200 caracteres.');
  setBusy(true);setError('');
  try{
    const voidId='void-'+record.id;
    if(isDemo){
      if(demoVoids.some(v=>v.visitId===record.id))throw Error('La atención ya fue anulada.');
      if((demoClientState.points||0)<record.points||demoClientState.visits<1)throw Error('No se puede anular: saldo o visitas insuficientes.');
      setDemoVoids(rows=>[...rows,{id:voidId,visitId:record.id,userId:'demo',points:record.points,reason,staffId:'demo-jefa',createdAt:{toDate:()=>new Date()}}]);
      setDemoClientState(c=>({...c,points:c.points-record.points,visits:c.visits-1}));
    }else{
      if(!db||!canVoid)throw Error('La conexión con Firebase no está disponible para anular atenciones.');
      const visitRef=db.collection('visits').doc(record.id);
      const voidRef=db.collection('voids').doc(voidId);
      const userRef=db.collection('users').doc(record.userId);
      await db.runTransaction(async t=>{
        const original=await t.get(visitRef);
        const previous=await t.get(voidRef);
        const client=await t.get(userRef);
        if(!original.exists||!client.exists)throw Error('No se encontró la atención o la clienta.');
        if(previous.exists)throw Error('Esta atención ya fue anulada.');
        const visit=original.data(),balance=client.data();
        if(visit.userId!==record.userId||visit.points!==record.points)throw Error('Los datos de la atención no coinciden.');
        if((balance.points||0)<visit.points||(balance.visits||0)<1)throw Error('La clienta ya usó esos puntos o no tiene visitas suficientes. No se puede anular automáticamente.');
        t.set(voidRef,{visitId:record.id,userId:visit.userId,points:visit.points,reason,staffId:user.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
        t.update(userRef,{points:balance.points-visit.points,visits:balance.visits-1,lastEventId:voidId,lastEventType:'void',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      });
    }
    setVoidTarget(null);setVoidReason('');
    showNotice('Atención anulada: -'+record.points+' puntos y -1 visita. El historial se conserva.');
  }catch(x){showError(x)}finally{setBusy(false)}
}

async function resolveReward(request,approve){
setBusy(true);setError('');
try{
  const prize=REWARDS.find(z=>z.id===request.rewardId);
  if(!prize)throw Error('Recompensa no encontrada.');
  if(isDemo){
    const existing=demoRequestsState.find(r=>r.id===request.id&&r.status==='pending');
    if(!existing)throw Error('El canje ya fue procesado.');
    if(approve&&demoClientState.points<prize.points)throw Error('Puntos insuficientes.');
    if(approve)setDemoClientState(c=>({...c,points:c.points-prize.points}));
    setDemoRequestsState(rows=>rows.map(r=>r.id===request.id?{...r,status:approve?'approved':'rejected'}:r));
    showNotice(approve?'Canje simulado aprobado.':'Canje simulado rechazado.');
    return;
  }
  if(!db||!isAdmin)throw new Error('Solo la jefa de salón puede procesar canjes.');
  const redemptionRef=db.collection('redemptions').doc(request.id);
  const userRef=db.collection('users').doc(request.userId);
  await db.runTransaction(async t=>{
    const redemption=await t.get(redemptionRef);
    const client=await t.get(userRef);
    if(!redemption.exists||redemption.data().status!=='pending')throw Error('Canje ya procesado.');
    if(!client.exists)throw Error('Clienta no encontrada.');
    const confirmed=REWARDS.find(r=>r.id===redemption.data().rewardId);
    if(!confirmed)throw Error('Recompensa desconocida.');
    if(approve){
      if((client.data().points||0)<confirmed.points)throw Error('La clienta no tiene suficientes puntos.');
      t.update(userRef,{points:client.data().points-confirmed.points,lastEventId:redemptionRef.id,lastEventType:'redemption',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
    t.update(redemptionRef,{status:approve?'approved':'rejected',processedBy:user.uid,processedAt:firebase.firestore.FieldValue.serverTimestamp()});
  });
  showNotice(approve?'Canje aprobado: puntos descontados.':'Solicitud rechazada.');
}catch(x){showError(x)}finally{setBusy(false)}
}
